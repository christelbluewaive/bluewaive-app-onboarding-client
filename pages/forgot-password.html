<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mot de passe oublié — Espace Client Bluewaive</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #2682B4 0%, #1a5c8d 100%);
      }
      .login-card {
        background: white;
        border-radius: 12px;
        padding: 48px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      .login-logo {
        display: flex;
        justify-content: center;
        margin-bottom: 24px;
      }
      .login-logo img {
        height: 40px;
        width: auto;
        border-radius: 8px;
      }
      .login-card h1 {
        font-size: 28px;
        margin-bottom: 12px;
        color: #1a1a1a;
      }
      .info-message {
        padding: 16px;
        background: #eef6fb;
        border: 1px solid #cfe4f0;
        border-radius: 8px;
        color: #1a5c8d;
        font-size: 14px;
        line-height: 1.5;
        margin-top: 12px;
      }
      .back-link {
        display: block;
        margin-top: 24px;
        text-align: center;
        font-size: 14px;
        color: #2682B4;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="login-logo"><img src="/logo-light-bg.png" alt="Bluewaive" /></div>
        <h1>Mot de passe oublié ?</h1>

        <div class="info-message">
          Cette fonctionnalité sera prochainement disponible. En attendant, contactez Bluewaive pour réinitialiser votre accès.
        </div>

        <a class="back-link" href="/login">&larr; Retour à la connexion</a>
      </div>
    </div>
  </body>
</html>
