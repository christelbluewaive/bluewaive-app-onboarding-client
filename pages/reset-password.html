<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réinitialiser le mot de passe - Espace Client Bluewaive</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #2682B4 0%, #1a5c8d 100%);
      }
      .login-card {
        background: white;
        border-radius: 12px;
        padding: 48px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      .login-card h1 {
        font-size: 28px;
        margin-bottom: 12px;
        color: #1a1a1a;
      }
      .login-card .subtitle {
        color: #666;
        margin-bottom: 32px;
        font-size: 14px;
      }
      .login-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .form-group label {
        font-weight: 600;
        color: #1a1a1a;
        font-size: 14px;
      }
      .form-group input {
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.2s;
      }
      .form-group input:focus {
        outline: none;
        border-color: #2682B4;
      }
      .login-form button {
        padding: 12px 16px;
        background: linear-gradient(135deg, #2682B4 0%, #1a5c8d 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .login-form button:hover {
        opacity: 0.9;
      }
      .login-form button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .error-message, .success-message {
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14px;
        display: none;
      }
      .error-message {
        background: #fee;
        border: 1px solid #fcc;
        color: #c33;
      }
      .success-message {
        background: #eafaf0;
        border: 1px solid #bfe8cf;
        color: #1e8e57;
      }
      .error-message.show, .success-message.show {
        display: block;
      }
      .back-link {
        display: block;
        margin-top: 20px;
        text-align: center;
        font-size: 14px;
        color: #2682B4;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <h1>Nouveau mot de passe</h1>
        <p class="subtitle" id="subtitle">Choisissez un nouveau mot de passe pour votre compte.</p>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form class="login-form" id="resetForm">
          <div class="form-group">
            <label for="newPassword">Nouveau mot de passe</label>
            <input type="password" id="newPassword" name="newPassword" placeholder="••••••••" minlength="8" required />
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirmer le nouveau mot de passe</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" minlength="8" required />
          </div>
          <button type="submit" id="submitBtn">Réinitialiser le mot de passe</button>
        </form>

        <a class="back-link" href="/login">&larr; Retour à la connexion</a>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const form = document.getElementById('resetForm');
        const errorEl = document.getElementById('errorMessage');
        const successEl = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');

        if (!token) {
          document.getElementById('subtitle').textContent = 'Ce lien de réinitialisation est invalide.';
          form.style.display = 'none';
          errorEl.textContent = 'Merci de refaire une demande depuis la page "Mot de passe oublié".';
          errorEl.classList.add('show');
          return;
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();

          const newPassword = document.getElementById('newPassword').value;
          const confirmPassword = document.getElementById('confirmPassword').value;

          errorEl.classList.remove('show');
          successEl.classList.remove('show');

          if (newPassword !== confirmPassword) {
            errorEl.textContent = 'Les mots de passe ne correspondent pas.';
            errorEl.classList.add('show');
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = 'Réinitialisation en cours...';

          try {
            const response = await fetch('/api/reset-password', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token, newPassword, confirmPassword })
            });
            const data = await response.json();

            if (response.ok && data.ok) {
              successEl.textContent = data.message || 'Votre mot de passe a été mis à jour.';
              successEl.classList.add('show');
              form.style.display = 'none';
            } else {
              errorEl.textContent = data.error || 'Une erreur est survenue.';
              errorEl.classList.add('show');
            }
          } catch (error) {
            errorEl.textContent = 'Erreur de connexion. Merci de réessayer.';
            errorEl.classList.add('show');
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Réinitialiser le mot de passe';
          }
        });
      });
    </script>
  </body>
</html>
